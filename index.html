<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study sound meter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#f4f6ff;--mute:rgba(235,240,255,.62);--line:rgba(255,255,255,.16)}
*{box-sizing:border-box;margin:0}
body{font-family:Outfit,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#070a18;min-height:100vh;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.55;z-index:0;animation:drift 26s ease-in-out infinite alternate}
.o1{width:480px;height:480px;background:#4f5bff;top:-140px;left:-120px}
.o2{width:420px;height:420px;background:#14b8a6;bottom:-120px;right:-100px;animation-delay:-9s}
.o3{width:320px;height:320px;background:#a855f7;top:38%;left:55%;opacity:.35;animation-delay:-17s}
@keyframes drift{to{transform:translate(60px,-50px) scale(1.12)}}
main{position:relative;z-index:1;width:100%;max-width:560px;display:grid;gap:16px;align-content:start}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.05));-webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%);border:1px solid var(--line);border-radius:28px;box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(255,255,255,.05);padding:22px}
#card{--zc:#a5b4fc}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h2{font-size:1rem;font-weight:500;color:var(--mute)}
.pill{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--mute);padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.pill i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35)}
.pill.on i{background:#5eead4;box-shadow:0 0 10px #5eead4}
.status{font-size:clamp(1.6rem,6.4vw,2.2rem);font-weight:600;letter-spacing:-.01em;text-align:center;line-height:1.3}
.status span{padding:0 .2em;background:linear-gradient(transparent 58%,color-mix(in srgb,var(--zc) 45%,transparent) 58%);-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background .5s}
.gauge{position:relative;width:min(100%,290px);margin:10px auto 0;aspect-ratio:1}
.gauge svg{width:100%;height:100%;display:block}
.track,.arc{fill:none;stroke-width:14;stroke-linecap:round}
.track{stroke:rgba(255,255,255,.1);stroke-dasharray:471.24 628.32}
.arc{stroke:var(--zc);stroke-dasharray:.1 628.32;transition:stroke .5s;filter:drop-shadow(0 0 7px var(--zc))}
.ends{fill:rgba(235,240,255,.4);font-size:11px;font-family:inherit;text-anchor:middle}
.read{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding-bottom:6px}
.num{font-size:clamp(3.2rem,14vw,4rem);font-weight:500;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.unit{color:var(--mute);margin-top:6px;font-size:.95rem}
.tip{text-align:center;color:var(--mute);min-height:2.7em;margin:4px auto 14px;max-width:34ch;line-height:1.35}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:18px}
.chip{display:flex;align-items:center;gap:7px;font-size:.82rem;padding:7px 12px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--mute);opacity:.6;transition:all .4s}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip small{font-size:.74rem;opacity:.7}
.chip.on{opacity:1;color:#fff;background:color-mix(in srgb,var(--c) 22%,transparent);border-color:color-mix(in srgb,var(--c) 65%,transparent);box-shadow:0 0 18px color-mix(in srgb,var(--c) 35%,transparent)}
.row{display:flex;gap:12px}
.btn{flex:1;font:inherit;font-weight:500;font-size:1rem;color:#fff;padding:14px 18px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.08);cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.28);transition:transform .15s,background .25s}
.btn:hover{background:rgba(255,255,255,.14)}
.btn:active{transform:scale(.98)}
.btn.primary{flex:1.6;background:linear-gradient(135deg,rgba(110,130,255,.6),rgba(45,212,191,.5));border-color:rgba(255,255,255,.28)}
.btn.primary:hover{background:linear-gradient(135deg,rgba(130,150,255,.72),rgba(45,212,191,.62))}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid #fff;outline-offset:3px}
.err{color:#fda4af;font-size:.88rem;text-align:center;min-height:1.2em;margin-top:10px}
.gh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.gh h2{color:var(--ink)}
.gh span{color:var(--mute);font-size:.82rem}
canvas{display:block;width:100%;height:190px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{padding:11px 12px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.stat small{display:block;color:var(--mute);font-size:.78rem;margin-bottom:3px}
.stat b{font-weight:500;font-size:1.2rem;font-variant-numeric:tabular-nums}
.ctl{display:flex;flex-wrap:wrap;gap:14px 22px}
.grp small{display:block;color:var(--mute);font-size:.78rem;margin-bottom:6px}
.seg{display:flex;padding:3px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.seg button{font:inherit;font-size:.92rem;color:var(--mute);background:none;border:0;padding:8px 16px;border-radius:11px;cursor:pointer}
.seg button[aria-pressed=true]{color:#fff;background:rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
details.glass{padding:0}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:18px 22px}
summary::-webkit-details-marker{display:none}
summary h2{flex:1}
summary b{font-weight:500;font-variant-numeric:tabular-nums}
summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);transition:transform .25s;margin:-3px 2px 0 6px}
details[open] summary::after{transform:rotate(225deg);margin-top:3px}
.calbody{padding:0 22px 22px}
.offbox{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:4px 0 12px}
.offbox input{width:150px;font:inherit;font-size:2.2rem;font-weight:500;text-align:center;color:#fff;font-variant-numeric:tabular-nums;padding:8px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.08)}
.offbox span{color:var(--mute)}
.nudge{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.nudge button,.match button,.restore{font:inherit;color:#fff;padding:10px 0;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.09);cursor:pointer}
.nudge button:hover,.match button:hover,.restore:hover{background:rgba(255,255,255,.2)}
.match{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--mute);font-size:.92rem}
.match input{width:90px;font:inherit;color:#fff;text-align:center;padding:9px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.08)}
.match button{padding:9px 18px}
.restore{width:100%;margin-top:14px;font-size:.9rem;color:var(--mute)}
.note{color:var(--mute);font-size:.78rem;text-align:center;opacity:.8;padding:0 10px}
@media (prefers-reduced-motion:reduce){.orb{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<main>
  <section class="glass" id="card" aria-label="Sound level meter">
    <div class="top"><h2>Study sound meter</h2><div class="pill" id="live"><i></i><span id="livetxt">Not listening</span></div></div>
    <h1 class="status" aria-live="polite"><span id="stxt">Ready to listen</span></h1>
    <div class="gauge">
      <svg viewBox="0 0 240 240" aria-hidden="true">
        <circle class="track" cx="120" cy="120" r="100" transform="rotate(135 120 120)"/>
        <circle class="arc" id="arc" cx="120" cy="120" r="100" transform="rotate(135 120 120)"/>
        <text class="ends" x="49" y="216">20</text><text class="ends" x="191" y="216">100</text>
      </svg>
      <div class="read"><div class="num" id="num">--.-</div><div class="unit" id="unit">dB(A) · Slow</div></div>
    </div>
    <p class="tip" id="tip">Tap Start and allow microphone access.</p>
    <div class="chips" id="chips"></div>
    <div class="row"><button class="btn primary" id="toggle">Start</button><button class="btn" id="reset">Reset</button></div>
    <div class="err" id="err" role="alert"></div>
  </section>

  <section class="glass" aria-label="Live sound graph">
    <div class="gh"><h2>Live sound level</h2><span>Last 60 seconds</span></div>
    <canvas id="cv"></canvas>
  </section>

  <section class="glass" aria-label="Statistics and settings">
    <div class="stats">
      <div class="stat"><small>Leq (average)</small><b id="leq">--.-</b></div>
      <div class="stat"><small>Max</small><b id="max">--.-</b></div>
      <div class="stat"><small>Min</small><b id="min">--.-</b></div>
    </div>
    <div class="ctl">
      <div class="grp"><small>Weighting</small><div class="seg" id="wseg"><button data-v="A" aria-pressed="true">A</button><button data-v="C" aria-pressed="false">C</button><button data-v="Z" aria-pressed="false">Z</button></div></div>
      <div class="grp"><small>Response</small><div class="seg" id="rseg"><button data-v="Fast" aria-pressed="false">Fast</button><button data-v="Slow" aria-pressed="true">Slow</button></div></div>
    </div>
  </section>

  <details class="glass" aria-label="Calibration">
    <summary><h2>Calibration</h2><b id="sumoff">+20.6 dB</b></summary>
    <div class="calbody">
      <div class="offbox"><input id="off" type="number" step="0.1" inputmode="decimal" aria-label="Calibration offset in dB"><span>dB</span></div>
      <div class="nudge"><button data-d="-1">−1</button><button data-d="-0.1">−0.1</button><button data-d="0.1">+0.1</button><button data-d="1">+1</button></div>
      <div class="match"><span>Match to</span><input id="ref" type="number" step="0.1" inputmode="decimal" placeholder="47.0" aria-label="Reference dB reading"><span>dB</span><button id="match">Set</button></div>
      <button class="restore" id="restore">Restore calibrated default (20.6 dB)</button>
    </div>
  </details>
  <p class="note">Readings are estimates, good to within a few dB once calibrated.</p>
</main>

<script>
(()=>{
const BASE=100,DEFAULT_OFF=20.6,KEEP=600,MIN=20,MAXDB=100,ARC=471.24;
const TAU={Fast:.125,Slow:1};
const ZONES=[
 {max:35,name:"Deep focus",range:"under 35",tip:"Silent enough for exams and heavy reading.",c:"#7dd3fc"},
 {max:50,name:"Perfect study session",range:"35–50",tip:"Calm and steady. This is the sweet spot for concentrating.",c:"#5eead4"},
 {max:60,name:"Light study only",range:"50–60",tip:"Fine for notes and review, but hard topics will suffer.",c:"#fde047"},
 {max:70,name:"Getting noisy",range:"60–70",tip:"Focus starts to slip. Try a quieter spot.",c:"#fdba74"},
 {max:Infinity,name:"DON’T study",range:"70+",tip:"Too loud to concentrate. Move somewhere quieter.",c:"#fb7185"}
];
const $=id=>document.getElementById(id);
const cv=$("cv"),g=cv.getContext("2d");
let ctx=null,stream=null,analyser=null,buf=null,src=null,chains={},running=false;
let w="A",resp="Slow",offset=DEFAULT_OFF;
try{const o=parseFloat(localStorage.getItem("studyMeterOffset"));if(!isNaN(o))offset=o}catch(e){}
let P=null,sumP=0,T=0,maxR=null,minR=null,hist=[],last=0,startT=0,lastSample=0,shownAt=0,disp=null,zi=null;
const raw=pw=>10*Math.log10(Math.max(pw,1e-14))+BASE;
const r1=x=>Math.round(x*10)/10;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const err=m=>{$("err").textContent=m};

ZONES.forEach(z=>{const s=document.createElement("span");s.className="chip";s.style.setProperty("--c",z.c);s.innerHTML="<i></i>"+z.name+" <small>"+z.range+"</small>";$("chips").appendChild(s)});

function setIdle(){
  zi=null;$("card").style.setProperty("--zc","#a5b4fc");
  $("stxt").textContent="Ready to listen";$("tip").textContent="Tap Start and allow microphone access.";
  [...$("chips").children].forEach(c=>c.classList.remove("on"));
  $("num").textContent="--.-";$("arc").style.strokeDasharray=".1 628.32";
}
function setZone(i){
  zi=i;const z=ZONES[i];$("card").style.setProperty("--zc",z.c);
  $("stxt").textContent=z.name;$("tip").textContent=z.tip;
  [...$("chips").children].forEach((c,k)=>c.classList.toggle("on",k===i));
}
function pickZone(v){
  let i=ZONES.findIndex(z=>v<z.max);if(i<0)i=ZONES.length-1;
  if(zi!==null&&Math.abs(i-zi)===1){const edge=i>zi?ZONES[zi].max:ZONES[i].max;if(Math.abs(v-edge)<1.5)return zi}
  return i;
}
function paintStats(){
  $("unit").textContent="dB("+w+") · "+resp;
  const f=x=>x.toFixed(1);
  $("leq").textContent=T>0?f(raw(sumP/T)+offset):"--.-";
  $("max").textContent=maxR===null?"--.-":f(maxR+offset);
  $("min").textContent=minR===null?"--.-":f(minR+offset);
}
function showOff(){
  $("off").value=offset.toFixed(1);
  $("sumoff").textContent=(offset<0?"−":"+")+Math.abs(offset).toFixed(1)+" dB";
}
function setOff(v){
  offset=clamp(r1(v),-80,80);showOff();
  try{localStorage.setItem("studyMeterOffset",offset)}catch(e){}
  paintStats();
}
function clearData(){
  P=null;sumP=0;T=0;maxR=null;minR=null;hist=[];disp=null;
  if(!running)setIdle();
  paintStats();
}
function mark(id,v){document.querySelectorAll("#"+id+" button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v))}

function connect(){
  src.disconnect();Object.values(chains).flat().forEach(n=>n.disconnect());
  let p=src;chains[w].forEach(n=>{p.connect(n);p=n});p.connect(analyser);
}
async function start(){
  err("");
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){err("This browser can’t access a microphone. Try Chrome, Edge, Safari or Firefox.");return}
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}
  catch(e){
    const framed=window.self!==window.top;
    err(e.name==="NotFoundError"?"No microphone was found. Plug one in or check your device’s sound settings."
      :framed?"This preview doesn’t allow microphone access. Download the file and open it directly in your browser."
      :"Microphone access is blocked. Click the lock icon in the address bar, set Microphone to Allow, then reload the page.");
    return}
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  if(ctx.state==="suspended")await ctx.resume();
  analyser=ctx.createAnalyser();analyser.fftSize=1024;analyser.smoothingTimeConstant=0;
  const mute=ctx.createGain();mute.gain.value=0;analyser.connect(mute);mute.connect(ctx.destination);
  src=ctx.createMediaStreamSource(stream);
  const bq=(type,f,q)=>{const n=ctx.createBiquadFilter();n.type=type;n.frequency.value=f;n.Q.value=20*Math.log10(q);return n};
  const gA=ctx.createGain();gA.gain.value=1.2589;
  const gC=ctx.createGain();gC.gain.value=1.0072;
  chains={
    A:[bq("highpass",20.6,.5),bq("highpass",281.9,.3334),bq("lowpass",12194,.5),gA],
    C:[bq("highpass",20.6,.5),bq("lowpass",12194,.5),gC],
    Z:[]
  };
  connect();buf=new Float32Array(analyser.fftSize);
  running=true;last=startT=performance.now();
  $("toggle").textContent="Pause";$("live").classList.add("on");$("livetxt").textContent="Listening";
}
function pause(){
  running=false;if(stream)stream.getTracks().forEach(t=>t.stop());if(ctx)ctx.close();
  stream=null;ctx=null;$("toggle").textContent="Resume";$("live").classList.remove("on");$("livetxt").textContent="Paused";
}

$("toggle").onclick=()=>running?pause():start();
$("reset").onclick=()=>{err("");clearData()};
document.querySelectorAll("#wseg button").forEach(b=>b.onclick=()=>{w=b.dataset.v;mark("wseg",w);if(running)connect();clearData()});
document.querySelectorAll("#rseg button").forEach(b=>b.onclick=()=>{resp=b.dataset.v;mark("rseg",resp);paintStats()});
document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>setOff(offset+parseFloat(b.dataset.d)));
$("off").onchange=()=>{const v=parseFloat($("off").value);if(isNaN(v))showOff();else setOff(v)};
$("restore").onclick=()=>setOff(DEFAULT_OFF);
$("match").onclick=()=>{
  const t=parseFloat($("ref").value);
  if(!running||P===null){err("Press Start first, then match while the sound is playing.");return}
  if(isNaN(t)){err("Type the dB value you want to match, like 47.0.");return}
  err("");setOff(t-raw(P));
};

function drawGraph(){
  const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
  g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  const L=30,R=6,T0=8,B=8,pw=W-L-R,ph=H-T0-B;
  const y=v=>T0+ph*(1-(clamp(v,MIN,MAXDB)-MIN)/(MAXDB-MIN));
  g.fillStyle="rgba(94,234,212,.09)";g.fillRect(L,y(50),pw,y(35)-y(50));
  g.fillStyle="rgba(251,113,133,.09)";g.fillRect(L,y(MAXDB),pw,y(70)-y(MAXDB));
  g.font="11px Outfit,system-ui,sans-serif";g.textBaseline="middle";g.textAlign="right";
  [30,50,70,90].forEach(v=>{g.strokeStyle="rgba(255,255,255,.09)";g.lineWidth=1;g.beginPath();g.moveTo(L,y(v));g.lineTo(W-R,y(v));g.stroke();g.fillStyle="rgba(235,240,255,.45)";g.fillText(v,L-8,y(v))});
  const n=hist.length;
  if(n<2){g.textAlign="center";g.fillStyle="rgba(235,240,255,.5)";g.font="14px Outfit,system-ui,sans-serif";g.fillText(running?"Listening…":"Press Start to see your sound levels live",L+pw/2,T0+ph/2);return}
  const step=pw/(KEEP-1),X=i=>L+pw-(n-1-i)*step,Y=i=>y(hist[i]+offset);
  const gr=g.createLinearGradient(0,T0,0,T0+ph);
  [[0,"#fb7185"],[.375,"#fb7185"],[.475,"#fdba74"],[.5625,"#fde047"],[.6875,"#5eead4"],[.875,"#7dd3fc"],[1,"#7dd3fc"]].forEach(s=>gr.addColorStop(s[0],s[1]));
  g.beginPath();g.moveTo(X(0),Y(0));
  for(let i=1;i<n;i++)g.lineTo(X(i),Y(i));
  g.lineTo(X(n-1),T0+ph);g.lineTo(X(0),T0+ph);g.closePath();
  g.globalAlpha=.16;g.fillStyle=gr;g.fill();g.globalAlpha=1;
  g.beginPath();g.moveTo(X(0),Y(0));
  for(let i=1;i<n;i++)g.lineTo(X(i),Y(i));
  g.lineWidth=2.5;g.lineJoin="round";g.lineCap="round";g.strokeStyle=gr;
  g.shadowBlur=10;g.shadowColor=zi!==null?ZONES[zi].c:"#a5b4fc";g.stroke();g.shadowBlur=0;
  g.beginPath();g.arc(X(n-1),Y(n-1),4,0,Math.PI*2);g.fillStyle="#fff";g.fill();
}

function frame(t){
  if(running){
    const dt=Math.min(.1,Math.max(0,(t-last)/1000));last=t;
    analyser.getFloatTimeDomainData(buf);
    let s=0;for(let i=0;i<buf.length;i++)s+=buf[i]*buf[i];
    const p=s/buf.length;
    if(t-startT>600){
      P=P===null?p:P+(p-P)*(1-Math.exp(-dt/TAU[resp]));
      sumP+=p*dt;T+=dt;
      const r=raw(P);
      maxR=maxR===null?r:Math.max(maxR,r);minR=minR===null?r:Math.min(minR,r);
      if(t-lastSample>=100){lastSample=t;hist.push(r);if(hist.length>KEEP)hist.shift()}
    }
  }
  if(P!==null){
    const v=raw(P)+offset;
    disp=disp===null?v:disp+(v-disp)*.14;
    const f=clamp((disp-MIN)/(MAXDB-MIN),0,1);
    $("arc").style.strokeDasharray=Math.max(f*ARC,.1)+" 628.32";
    const i=pickZone(disp);if(i!==zi)setZone(i);
    if(t-shownAt>120){shownAt=t;$("num").textContent=disp.toFixed(1);paintStats()}
  }
  drawGraph();
  requestAnimationFrame(frame);
}
showOff();paintStats();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
